name: Website

# libreshard.com builds the gallery from this repository. When an entry changes on main, the site is
# rebuilt through a Cloudflare Pages deploy hook whose URL is the repository secret
# WEBSITE_DEPLOY_HOOK (the same hook the app's repository uses). It can also be run by hand.
on:
  push:
    branches: [main]
    paths: ['shards/**', 'screenshots/**']
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    name: Rebuild the website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::WEBSITE_DEPLOY_HOOK isn't set: the website wasn't rebuilt"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "The website is rebuilding."
